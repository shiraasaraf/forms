<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="/submit" method="post">
        <fieldset>
            <legend>Text input</legend>
            <br>
            <label for="Username">Username</label>
            <input type="text" id="Username" name="Username">
            <br>

            <br>
            <label for="Password">Password</label>
            <input type="password" id="Password" name="Password">
            <br>

            <br>
            <label for="Email">Email</label>
            <input type="email" id="Email" name="Email">
            <br>



        </fieldset>


        <fieldset>

            <br>
            <label for="File"></label>
            <input type="file" name="file" id="file">
            <br>

            <br>
            <label for="range"></label>
            <input type="range" id="volume" name="volume" min="0" max="100" value="50">
            <br>

        </fieldset>

        <fieldset>
            <legend>Radio</legend>

            <label for="small">small</label>
            <input type="radio" id="small" name="size" value="s">

            <label for="medium">medium</label>
            <input type="radio" id="medium" name="size" value="m">

            <label for="large">large</label>
            <input type="radio" id="large" name="size" value="l">

        </fieldset>

        <fieldset>
            <legend>Checkbox</legend>

            <input type="checkbox" id="html" name="topics" value="html">
            <label for="html"> HTML</label>

            <input type="checkbox" id="css" name="topics" value="css">
            <label for="css"> CSS</label>

            <input type="checkbox" id="js" name="topics" value="js">
            <label for="js"> JavaScript</label>

        </fieldset>

        <fieldset>
            <legend>Select</legend>
            <label for="country">Country</label>
            <select name="country" id="country">
                <option value="il">Israel</option>
                <option value="us">Israel</option>
                <option value="il">Israel</option>
                <option value="il">Israel</option>
                <option value="il">Israel</option>
            </select>
        </fieldset>

        <button>Send</button>

    </form>

</body>

</html>
