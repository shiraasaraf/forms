<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <form action="/submit" method="post">
        <fieldset>
            <legend>Personal Information</legend>

            <label for="fname">Full Name</label>
            <input type="text" id="fname" name="fname" min="2" max="20" required><br><br>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="Phone">Phone </label>
            <input type="tel" id="Phone" name="Phone" pattern="[0-9]{3}-[0-9]{7}"><br><br>

        </fieldset>

        <fieldset>
            <legend>Ticket & Workshops</legend>

            <select name="Ticket type" id="Ticket type">
                <option value="Standard">Standard</option>
                <option value="VIP">VIP</option>
                <option value="Student">Student</option>
                required
            </select><br><br>

            <input type="checkbox" id="Workshops1" name="Workshops1" value="Web Performance">
            <label for="Workshops1">Web Performance</label><br>
            <input type="checkbox" id="Workshops2" name="Workshops2" value="Accessibility">
            <label for="Workshops2"></label>Accessibility<br>
            <input type="checkbox" id="Workshops3" name="Workshops3" value="Testing">
            <label for="Workshops3"></label>Testing<br><br>


            <input type="radio" id="None" name="Diet" value="NONE">
            <label for="None">None</label><br>
            <input type="radio" id="Vegan" name="Diet" value="VEGAN">
            <label for="Vegan">Vegan</label><br>
            <input type="radio" id="Kosher" name="Diet" value="KOSHER">
            <label for="Kosher">Kosher</label><br>
            <input type="radio" id="Halal" name="Diet" value="HALAL">
            <label for="Halal">Halal</label><br>
            <input type="radio" id="Other" name="Diet" value="OTHER">
            <label for="Other">Other</label><br>
            <input type="text" name="otherDiet" placeholder="Please specify">


        </fieldset>

        <fieldset>
            <legend>Payment Details</legend>
            <label for="cnumber">Card number</label>
            <input type="text" id="cnumber" name="cnumber" min="13" max="19" pattern="[0-9]{13,19}" required><br>

            <label for="edate">Expiry date</label>
            <input type="date" id="edate" name="Expiry date" required><br>

            <label for="cvv">CVV</label>
            <input type="password" id="cvv" name="CVV" pattern="[0-9]{3,4}"><br>


        </fieldset>

        <fieldset>
            <legend>Agreements</legend>
        </fieldset>

        <button>Submit</button>
    </form>


</body>

</html>
